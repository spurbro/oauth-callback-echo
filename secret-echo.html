<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Secret Echo</title></head>
<body style="font-family:monospace;padding:24px">
<h2>粘贴密钥到下面文本框</h2>
<textarea id="in" rows="4" style="width:100%;font-size:18px" placeholder="paste here"></textarea>
<pre id="out" style="font-size:20px;white-space:pre-wrap;word-break:break-all"></pre>
<script>
var nato={'-':'减号','_':'下划线'};
document.getElementById('in').addEventListener('input',function(){
  var s=this.value;
  var codes=[]; for(var i=0;i<s.length;i++) codes.push(s.charCodeAt(i));
  var sum=0; for(var i=0;i<codes.length;i++) sum+=codes[i];
  var spell=s.split('').map(function(c){
    if(c>='A'&&c<='Z')return '大写'+c;
    if(c>='a'&&c<='z')return '小写'+c;
    if(c>='0'&&c<='9')return '数字'+c;
    return nato[c]||('符号'+c);
  }).join(' ');
  document.getElementById('out').textContent=
   'LEN '+s.length+'\nCODES '+codes.join(' ')+'\nSUM '+(sum%9973)+'\nSPELL '+spell+'\nRAW '+s;
});
</script>
</body></html>
